<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>성균관대 공지 모아보기 (성대 공지 모아보기)</title>
  <meta
    name="description"
    content="성균관대(성대) 본교, 기계공학부, 학생성공센터 등 여러 학과 공지사항을 한 곳에서 모아보고 검색·필터링하는 성균관대 공지 모아보기 서비스."
  />
  <link rel="canonical" href="https://skku-notice.vercel.app/" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="성균관대 공지 모아보기" />
  <meta property="og:title" content="성균관대 공지 모아보기 (성대 공지 모아보기)" />
  <meta
    property="og:description"
    content="성균관대 여러 학과 공지사항을 한 곳에서 모아보고 검색·필터링하세요."
  />
  <meta property="og:url" content="https://skku-notice.vercel.app/" />
  <meta property="og:locale" content="ko_KR" />
  <meta name="twitter:card" content="summary" />

  <link rel="stylesheet" href="styles.css" />

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-2M75F1D656"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-2M75F1D656');
  </script>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1>성대 공지 모아보기</h1>
      <p class="tagline">여러 곳에 흩어진 성균관대 공지사항을 한 곳에서</p>
    </div>
  </header>

  <main class="wrap">
    <section class="filters" aria-label="공지 필터">
      <div class="filter-row">
        <span class="filter-label">출처</span>
        <div class="chips" id="site-filter" role="group" aria-label="출처 사이트 필터"></div>
        <button type="button" class="link-btn" id="manage-sites" aria-expanded="false">
          관리
        </button>
      </div>

      <div class="panel" id="site-panel" hidden>
        <p class="panel-title">보고 싶은 출처만 남겨두세요</p>
        <div class="checks" id="site-checks"></div>
      </div>

      <div class="filter-row">
        <span class="filter-label">카테고리</span>
        <div class="chips" id="category-filter" role="group" aria-label="카테고리 필터"></div>
        <button type="button" class="link-btn" id="manage-categories" aria-expanded="false">
          관리
        </button>
      </div>

      <div class="panel" id="category-panel" hidden>
        <p class="panel-title">보고 싶지 않은 카테고리를 꺼두세요</p>
        <div class="checks" id="category-checks"></div>
      </div>

      <div class="filter-row">
        <span class="filter-label">내 카테고리</span>
        <div class="chips" id="custom-filter" role="group" aria-label="사용자 카테고리 필터"></div>
        <button type="button" class="link-btn" id="add-custom" aria-expanded="false">＋ 추가</button>
      </div>

      <div class="panel" id="custom-panel" hidden>
        <p class="panel-title">제목에 아래 키워드가 들어간 공지를 묶어 봅니다</p>
        <form class="custom-form" id="custom-form">
          <input type="text" id="custom-name" placeholder="이름 (예: 장학금)" maxlength="20" required />
          <input type="text" id="custom-keywords" placeholder="키워드 (쉼표로 구분: 장학, 등록금)" required />
          <button type="submit" class="primary-btn">만들기</button>
        </form>
        <p class="panel-hint" id="custom-hint"></p>
      </div>

      <div class="filter-row">
        <span class="filter-label">사이트 추가</span>
        <div class="chips" id="add-site-info">
          <span class="inline-hint">우리 학과 공지도 자동으로 모아보세요</span>
        </div>
        <button type="button" class="link-btn" id="add-site-btn" aria-expanded="false">＋ 추가</button>
      </div>

      <div class="panel" id="add-site-panel" hidden>
        <p class="panel-title">
          성균관대(skku.edu) 학과·기관 공지 게시판 주소를 넣으면 서버가 대신 읽어와 등록합니다
        </p>
        <form class="custom-form" id="add-site-form">
          <input type="text" id="site-name" placeholder="학과 이름 (예: 소프트웨어학과)" maxlength="20" required />
          <input
            type="url"
            id="site-url"
            placeholder="https://xxx.skku.edu/.../notice.do"
            required
          />
          <button type="submit" class="primary-btn">등록</button>
        </form>
        <p class="panel-hint" id="add-site-hint"></p>
      </div>

      <div class="search-row">
        <input
          type="search"
          id="keyword"
          placeholder="제목 검색 (예: 장학, 모집, 신청)"
          autocomplete="off"
          aria-label="제목 키워드 검색"
        />
        <button type="button" id="reset" class="reset-btn">초기화</button>
      </div>
    </section>

    <p class="meta-line">
      <span id="count"></span>
      <span id="updated" class="updated"></span>
    </p>

    <ul class="notice-list" id="notice-list"></ul>
    <p class="empty" id="empty" hidden>조건에 맞는 공지가 없습니다.</p>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>
        비공식 서비스입니다. 정확한 내용은 각 공지의 원문을 확인하세요.
      </p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/api/config.js"></script>
  <script src="data/notices.js"></script>
  <script src="app.js"></script>
</body>
</html>
