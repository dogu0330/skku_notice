name: 공지 자동 크롤링

on:
  schedule:
    # UTC 기준. 한국시간(UTC+9) 07:00 / 13:00 / 19:00 에 실행됨
    - cron: "0 22,4,10 * * *"
  workflow_dispatch: {} # Actions 탭에서 수동으로도 실행 가능

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -r crawler/requirements.txt

      - name: 크롤링 + Supabase 동기화
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python crawler/crawl.py --pages 2

      - name: 변경된 데이터 커밋
        run: |
          git config user.name "skku-notice-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/notices.json data/notices.js
          git diff --cached --quiet || git commit -m "chore: 공지 자동 수집 갱신"
          git push
